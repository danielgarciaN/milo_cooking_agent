[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "milo-nutrition-chef"
version = "0.1.0"
description = "Núcleo verificable de MILO: datos nutricionales, recetas e ingestión documental"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.10,<3", "pydantic-settings>=2.7,<3", "pypdf>=5,<7", "fonttools>=4.55,<5", "httpx>=0.28,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "nbformat>=5,<6", "nbclient>=0.10,<1", "ipykernel>=6,<8"]
rag = ["langchain-google-genai>=4,<5", "langchain-chroma>=1,<2", "chromadb>=1,<2"]
agent = ["langgraph>=1,<2", "langgraph-checkpoint-sqlite>=3,<4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py311"
