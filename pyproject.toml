[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "milo-nutrition-chef"
version = "1.0.0"
description = "MILO — AI Nutrition Chef: asistente de cocina y nutrición con Gemini, RAG (ChromaDB) y LangGraph"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
# Las dependencias completas están en requirements.txt.
dependencies = ["pydantic>=2.10,<3", "pydantic-settings>=2.7,<3", "pypdf>=5,<7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
milo = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -p no:warnings"
markers = ["live: llamadas reales a Gemini y al índice local; ejecutar con --live"]

[tool.ruff]
line-length = 110
target-version = "py311"
